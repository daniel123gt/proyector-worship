<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Worship">
    <meta name="theme-color" content="#1f2937">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">

    <title>Projector</title>

    <style>

        body{
            margin:0;
            overflow:hidden;
            background:black;
        }

        #liveImage{
            width:100vw;
            height:100vh;
            object-fit:cover;
            display:block;
        }

        #fullscreenBtn{

            position:absolute;

            top:20px;
            right:20px;

            z-index:999;

            background:#06b6d4;

            color:white;

            border:none;

            border-radius:10px;

            padding:12px 18px;

            cursor:pointer;

            font-size:16px;

            font-weight:bold;
        }

    </style>

</head>

<body>

    <button id="fullscreenBtn">
        Full Screen
    </button>

    <img id="liveImage">

    <div id="liveBible" style="
    display:none;

    width:100vw;
    height:100vh;

    color:white;

    font-family:Arial, sans-serif;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:80px;

    box-sizing:border-box;

    text-align:center;
    ">

        <h1 id="bibleReference"></h1>

        <p id="bibleText" style="
            font-size:48px;
            line-height:1.5;
        "></p>

        <small id="bibleVersion">
        Reina Valera 1960
        </small>

    </div>

    <script>

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }

        document
        .getElementById("fullscreenBtn")
        .addEventListener("click", async () => {

            document.addEventListener(
                "fullscreenchange",
                () => {

                const btn =
                document.getElementById(
                    "fullscreenBtn"
                );

                if(document.fullscreenElement){

                    btn.style.display =
                    "none";

                }
                else{

                    btn.style.display =
                    "block";

                }

            });

            try {

                await document.documentElement
                .requestFullscreen();

                document
                .getElementById("fullscreenBtn")
                .style.display = "none";

            } catch(err) {

                console.log(err);

            }

        });

        setInterval(() => {

            const image =
                localStorage.getItem("liveImage");

            const bible =
                localStorage.getItem("liveBible");

            const liveImage =
                document.getElementById(
                    "liveImage"
                );

            const liveBible =
                document.getElementById(
                    "liveBible"
                );

            if(bible){

                const data =
                JSON.parse(bible);

                const background =
                localStorage.getItem(
                    "bibleBackground"
                );

                if(background){

                    liveBible.style.backgroundImage =
                    `url('${background}')`;

                    liveBible.style.backgroundSize =
                    "cover";

                    liveBible.style.backgroundPosition =
                    "center";

                    liveBible.style.backgroundRepeat =
                    "no-repeat";
                }

                liveImage.style.display =
                "none";

                liveBible.style.display =
                "flex";

                document.getElementById(
                    "bibleReference"
                ).textContent =
                `${data.book} ${data.chapter}:${data.verse}`;

                document.getElementById(
                    "bibleText"
                ).textContent =
                data.text;

            }

            else if(image){

                liveBible.style.display =
                "none";

             liveImage.style.display =
                "block";

                liveImage.src =
             image;

            }

        
        }, 500);

    </script>

</body>

</html>
